    <style>
        /* 全局样式重置与基础配置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* ========== 动态背景核心样式 ========== */
        #dynamic-background {
            position: fixed; /* 背景铺满整个页面，固定不滚动 */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* 背景置于最底层 */
            filter: brightness(0.8); /* 降低背景亮度，保证文字可读性 */
            background-color: #f5f5f5; /* 背景关闭时的默认色 */
        }

        /* 背景关闭样式 */
        #dynamic-background.bg-disabled {
            background-image: none !important;
        }

        /* 打赏内容容器：在背景上层，半透明背景提升可读性 */
        .reward-page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        /* ========== 打赏卡片样式（保留原有样式并优化） ========== */
        .reward-container {
            max-width: 600px;
            width: 90%;
            margin: 0 auto;
        }

        .reward-header {
            text-align: center;
            margin-bottom: 30px;
            color: #fff; /* 文字改为白色，适配深色背景 */
            text-shadow: 0 0 5px rgba(0,0,0,0.5); /* 加文字阴影，提升辨识度 */
        }

        /* ====== 新增：运行时间样式 ====== */
        .runtime-box {
            font-size: 16px;
            margin-bottom: 15px; /* 和下方标题保持间距 */
            text-align: center; /* 强制居中，双重保障 */
            text-shadow: 0 0 3px rgba(0,0,0,0.8); /* 提升动态背景下的可读性 */
        }

        /* 关键修改：可点击标题样式 */
        .clickable-title {
            font-size: 24px;
            margin-bottom: 10px;
            cursor: pointer; /* 鼠标指针变为手型 */
            transition: all 0.3s ease; /* 过渡动画 */
            display: inline-block; /* 适配hover效果 */
        }
        .clickable-title:hover {
            color: #16ffec; /*  hover时变色 */
            transform: scale(1.85); /* 轻微放大 */
        }

        /* 新增：可点击提示文字样式 */
        .clickable-tip {
            font-size: 16px;
            line-height: 1.5;
            cursor: pointer; /* 手型指针，提示可点击 */
            transition: color 0.3s ease; /* 颜色过渡动画 */
            text-shadow: 0 0 3px rgba(0,0,0,0.8);
        }
        .clickable-tip:hover {
            color: #ffd700; /* hover时变为金色 */
        }

        /* 关键修改：默认隐藏二维码区域，添加过渡动画 */
        .qrcode-cards {
            display: none; /* 默认隐藏 */
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            animation: fadeIn 0.5s ease-in-out; /* 显示时淡入动画 */
        }
        /* 淡入动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .qrcode-card {
            background-color: rgba(255, 255, 255, 0.686); /* 卡片半透明白色背景 */
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
            width: 260px;
            text-align: center;
        }

        .qrcode-card.wechat {
            border-top: 4px solid #07c160;
        }

        .qrcode-card.alipay {
            border-top: 4px solid #1677ff;
        }

        .qrcode-card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .qrcode-card.wechat h2 {
            color: #07c160;
        }

        .qrcode-card.alipay h2 {
            color: #1677ff;
        }

        .qrcode-box {
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }

        .qrcode-table td {
            width: 8px;
            height: 8px;
            padding: 0;
            margin: 0;
            border: 0;
        }

        .qrcode-dark {
            background: #000;
        }

        .qrcode-light {
            background: #fff;
        }

        .card-tip {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        /* ========== 右下角按钮容器核心样式 ========== */
        .btn-group-fixed {
            position: fixed; /* 固定定位 */
            bottom: 20px;    /* 距离底部20px */
            right: 20px;     /* 距离右侧20px */
            display: flex;   /* 横向排列按钮 */
            gap: 10px;       /* 按钮间距 */
            z-index: 9999;   /* 置顶，不被遮挡 */
        }

        /* 按钮激活状态样式（区分开关状态） */
        .mdui-btn.mdui-color-blue-grey {
            background-color: #607d8b !important;
            color: #fff !important;
        }

        /* 移动端适配：缩小间距和位置 */
        @media (max-width: 768px) {
            .btn-group-fixed {
                bottom: 15px;
                right: 15px;
                gap: 8px;
            }
            /* ====== 新增：移动端运行时间适配 ====== */
            .runtime-box {
                font-size: 14px;
            }
            .clickable-title {
                font-size: 20px; /* 移动端标题缩小 */
            }
            .clickable-tip {
                font-size: 14px; /* 移动端提示文字缩小 */
            }
        }

        /* ========== 新增：弹窗样式 ========== */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-container {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        .modal-title {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .modal-input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }
        .modal-input:focus {
            border-color: #1677ff;
        }
        .modal-btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .modal-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .modal-confirm {
            background: #1677ff;
            color: #fff;
        }
        .modal-confirm:hover {
            background: #0e66e2;
        }
        .modal-close {
            background: #999;
            color: #fff;
        }
        .modal-close:hover {
            background: #777;
        }
        .error-tip {
            color: #f53f3f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

                </div>

                    <h2>支付宝打赏</h2>
                    <div class="qrcode-box" id="alipay-qrcode"></div>
                    <p class="card-tip">扫码后可任意金额打赏</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 右下角MDUI按钮容器 ========== -->
    <div class="btn-group-fixed">
        <button class="mdui-textfield-close mdui-btn mdui-btn-icon mdui-ripple" id="toggle-tx" mdui-tooltip="{content: &#39;樱花落叶&#39;}">
            <i class="mdui-icon material-icons">filter_vintage</i>
        </button>
    </div>

            <input type="text" class="modal-input" id="accessCode" placeholder="请输入4位数字访问码" maxlength="4">

                <button class="modal-btn modal-confirm" id="confirmCode">确认</button>
                <button class="modal-btn modal-close" id="closeModal">关闭</button>
            </div>
            <div class="error-tip" id="errorTip">访问码错误</div>
        </div>

            "https://api.r10086.com/%E5%9B%BE%E5%8C%85webp/%E4%B8%9C%E6%96%B9project1/b8b70058051a9536f743fb3501aebd05.webp",
            "https://api.r10086.com/%E5%9B%BE%E5%8C%85/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F2/08-29/bg_0_coma.png",
            "https://api.r10086.com/%E5%9B%BE%E5%8C%85/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F1/illust_75778903_20200206_165709.jpg",
            "https://pic.7po.com/7po/imgfile/20241031/31112400eok8.webp",
            "https://cs1.animestore.docomo.ne.jp/anime_kv/img/27/15/7/27157_1_d2.jpg?1718086806932",
            "https://wallpapercave.com/wp/wp14514683.jpg",
            "https://ts1.tc.mm.bing.net/th/id/R-C.4a839ba324d548143ce40097f7e41879?rik=KxSaUrDEV8O0zg&riu=http%3a%2f%2fi0.hdslb.com%2fbfs%2farchive%2f5230f6ddd1639e46422093f06f0795a36db26792.jpg&ehk=1o4rTJXIV2KfeLq7stdW5VU3vKs8aJc69QkBzn2mFuY%3d&risl=&pid=ImgRaw&r=0",
            "https://ts1.tc.mm.bing.net/th/id/R-C.fdcdb42e5f57c2a94085adb49e78b05b?rik=SG8yIoJfAhcOuw&riu=http%3a%2f%2fi1.hdslb.com%2fbfs%2farchive%2ff73bfd551f7d26d75bad9637e0f4f8d39b860337.jpg&ehk=JggLFzmDUnoJrKCyqeVU8bpZ8GGuHhAGTd8p%2b0%2bLwr8%3d&risl=&pid=ImgRaw&r=0",
            "https://cbu01.alicdn.com/img/ibank/2015/295/950/2563059592_1664902638.jpg",

      ];
      
      const mobileBackgrounds = [

        'https://api.r10086.com/%E5%9B%BE%E5%8C%85webp/%E6%9F%90%E7%A7%91%E5%AD%A6%E7%9A%84%E8%B6%85%E7%94%B5%E7%A3%81%E7%82%AE%E7%AB%96%E5%B1%8F%E7%B3%BB%E5%88%971/wallhaven-w8vzjq.webp',
        'https://api.r10086.com/%E5%9B%BE%E5%8C%85webp/%E6%9F%90%E7%A7%91%E5%AD%A6%E7%9A%84%E8%B6%85%E7%94%B5%E7%A3%81%E7%82%AE%E7%AB%96%E5%B1%8F%E7%B3%BB%E5%88%971/wallhaven-13kwog.webp',
        'https://api.r10086.com/%E5%9B%BE%E5%8C%85/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F1/illust_77340151_20200206_170829.jpg',
        'https://api.r10086.com/%E5%9B%BE%E5%8C%85/%E6%98%8E%E6%97%A5%E6%96%B9%E8%88%9F1/79519821_p0.jpg',

        'https://c-ssl.duitang.com/uploads/blog/202008/03/20200803075651_pubjh.jpg',
        'https://www.animeclick.it/immagini/anime/Atri_My_Dear_Moments/cover/Atri_My_Dear_Moments-cover.jpg',
        'https://c-ssl.duitang.com/uploads/blog/202206/03/20220603100527_07645.jpg',
      ];
      
      // 获取背景元素
      const backgroundElement = document.getElementById('dynamic-background');
      let currentIndex = 0;
      let backgrounds = [];
      let slideInterval;
      
      // 初始化背景轮播
      function initBackgroundSlider() {
        // 根据屏幕宽度选择对应的图片集合
        if (window.innerWidth < 768) { // 移动端阈值
          backgrounds = mobileBackgrounds;
        } else { // 桌面端
          backgrounds = desktopBackgrounds;
        }
        
        // 设置初始背景
        setBackground(0);
        
        // 启动轮播
        startSlideInterval();
      }
      
      // 设置背景图片
      function setBackground(index) {
        backgroundElement.style.backgroundImage = `url(${backgrounds[index]})`;
        backgroundElement.style.backgroundSize = 'cover';
        backgroundElement.style.backgroundPosition = 'center';
        backgroundElement.style.transition = 'background-image 1s ease-in-out';
        currentIndex = index;
      }

      // 启动轮播定时器
      function startSlideInterval() {
        // 清除现有定时器
        if (slideInterval) clearInterval(slideInterval);
        
        // 每5秒切换一次背景（改为随机切换）
        slideInterval = setInterval(() => {
          // 生成随机索引（避免与当前索引重复）
          let nextIndex;
          // 如果只有一张图片，直接使用0
          if (backgrounds.length === 1) {
            nextIndex = 0;
          } else {
            // 循环生成直到与当前索引不同
            do {
              nextIndex = Math.floor(Math.random() * backgrounds.length);
            } while (nextIndex === currentIndex);
          }
          setBackground(nextIndex);
        }, 5000);
      }
      
      // 监听窗口大小变化，动态切换图片集合
      window.addEventListener('resize', () => {
        const isMobile = window.innerWidth < 768;
        const wasMobile = backgrounds === mobileBackgrounds;
        
        // 只有当设备类型发生变化时才重新初始化
        if (isMobile !== wasMobile) {

    <!-- ====== 新增：运行时间JS代码 ====== -->
    <script>
        function show_date_time(){
            window.setTimeout("show_date_time()", 1000);
            BirthDay=new Date("1/16/2026 17:24:00"); // 可替换为你的建站时间
            today=new Date();
            timeold=(today.getTime()-BirthDay.getTime());
            sectimeold=timeold/1000
            secondsold=Math.floor(sectimeold);
            msPerDay=24*60*60*1000
            e_daysold=timeold/msPerDay
            daysold=Math.floor(e_daysold);
            e_hrsold=(e_daysold-daysold)*24;
            hrsold=Math.floor(e_hrsold);
            e_minsold=(e_hrsold-hrsold)*60;
            minsold=Math.floor((e_hrsold-hrsold)*60);
            seconds=Math.floor((e_minsold-minsold)*60);
            document.getElementById('span_dt_dt').innerHTML = daysold+' 天 '+hrsold+' 时 '+minsold+' 分 '+seconds+' 秒';
        }

        // DOM加载完成后启动运行时间计算
        document.addEventListener('DOMContentLoaded', function() {
            show_date_time();
        });
    </script>

    <!-- ========== 新增：访问码弹窗逻辑 ========== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取元素
            const toggleBtn = document.getElementById('toggle-reward');
            const qrcodeArea = document.getElementById('reward-qrcodes');
            const codeModal = document.getElementById('codeModal');
            const accessCodeInput = document.getElementById('accessCode');
            const confirmCodeBtn = document.getElementById('confirmCode');
            const closeModalBtn = document.getElementById('closeModal');
            const errorTip = document.getElementById('errorTip');
            const hideQrcodeTip = document.getElementById('toggle-hide-qrcode'); // 新增：获取提示文字元素

            // 保存原始文字内容
            const originalTitleText = toggleBtn.innerHTML;
            const originalTipText = hideQrcodeTip.innerHTML;

            // 点击标题显示弹窗（仅在二维码隐藏时）
            toggleBtn.addEventListener('click', function() {
                if (qrcodeArea.style.display !== 'flex') {
                    codeModal.style.display = 'flex';
                    accessCodeInput.value = ''; // 清空输入框
                    errorTip.style.display = 'none'; // 隐藏错误提示
                }
            });

            // 关闭弹窗
            closeModalBtn.addEventListener('click', function() {
                codeModal.style.display = 'none';
                errorTip.style.display = 'none';
            });

            // 验证访问码
            confirmCodeBtn.addEventListener('click', function() {
                const inputCode = accessCodeInput.value.trim();
                // 验证是否为4位数字且等于0721
                if (inputCode === '0721') {
                    codeModal.style.display = 'none';
                    qrcodeArea.style.display = 'flex';
                    // 修改提示文字，提示用户可点击收起
                    hideQrcodeTip.innerHTML = '点击此处收起二维码 ✨';
                } else {
                    errorTip.style.display = 'block'; // 显示错误提示
                }
            });

            // 支持回车验证
            accessCodeInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    confirmCodeBtn.click();
                }
            });

            // 点击弹窗遮罩关闭弹窗
            codeModal.addEventListener('click', function(e) {
                if (e.target === codeModal) {
                    codeModal.style.display = 'none';
                    errorTip.style.display = 'none';
                }
            });

            // 新增：点击提示文字收起二维码
            hideQrcodeTip.addEventListener('click', function() {
                if (qrcodeArea.style.display === 'flex') {
                    qrcodeArea.style.display = 'none'; // 隐藏二维码
                    hideQrcodeTip.innerHTML = originalTipText; // 恢复提示文字
                    toggleBtn.innerHTML = originalTitleText; // 恢复标题文字
                }
            });
        });
    </script>
